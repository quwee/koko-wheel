<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор шрифта — список призов</title>
<style>
  :root{
    --milk:#FBF6EF; --cream:#F3E9DC; --sand:#E6D3B8; --ink:#2B2723; --ink-soft:#6E645A;
    --brand:#1A1714; --line:rgba(43,39,35,.12);
    --bg:radial-gradient(120% 80% at 50% -10%, #FFFDFA 0%, var(--cream) 55%, #E9DAC6 100%);
    --card:rgba(255,255,255,.7);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px 80px}
  h1{max-width:900px;margin:0 auto 20px;font-size:20px}
  .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:14px}
  .card{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 22px rgba(120,95,65,.1)}
  .card .fname{font:600 12px/1 -apple-system,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
  .plist{list-style:none;margin:0;padding:0}
  .plist li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .plist li:last-child{border-bottom:0}
  .plist .n{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--sand);color:var(--ink);font-weight:500;font-size:14px}
  .plist .t{flex:1;min-width:0;font-size:18px;font-weight:400;line-height:1.35}
</style>
</head>
<body>
<h1>50 вариантов шрифта для списка призов (текущий дизайн, разные font-family)</h1>
<div class="grid" id="grid"></div>
<script>
const fonts = [
  "Manrope","Inter","Poppins","Montserrat","Nunito Sans","Work Sans","DM Sans","Outfit","Sora",
  "Plus Jakarta Sans","Urbanist","Lexend","Karla","Mulish","Rubik","Jost","Epilogue","Figtree",
  "Space Grotesk","Onest","Albert Sans","Hanken Grotesk","Public Sans","IBM Plex Sans",
  "Be Vietnam Pro","Cabin","Josefin Sans","Quicksand","Comfortaa","Raleway","Tenor Sans",
  "Cormorant Garamond","Playfair Display","EB Garamond","Lora","Cardo","Marcellus","Cormorant",
  "Bodoni Moda","Fraunces","Libre Caslon Text","Crimson Pro","Spectral","Prata","Italiana",
  "Philosopher","Cinzel","Judson","Vollkorn","Alegreya"
];

const link = document.createElement("link");
link.rel = "stylesheet";
link.href = "https://fonts.googleapis.com/css2?" +
  fonts.map(f => "family=" + encodeURIComponent(f) + ":wght@400;500").join("&") +
  "&display=swap";
document.head.appendChild(link);

const prizes = ["Скидка 5%", "Тканевая маска", "Набор миниатюр"];
const grid = document.getElementById("grid");
grid.innerHTML = fonts.map((f, i) => `
  <div class="card">
    <p class="fname">${i + 1}. ${f}</p>
    <ul class="plist" style="font-family:'${f}'">
      ${prizes.map((p, j) => `<li><span class="n">${j + 1}</span><span class="t">${p}</span></li>`).join("")}
    </ul>
  </div>
`).join("");
</script>
</body>
</html>
